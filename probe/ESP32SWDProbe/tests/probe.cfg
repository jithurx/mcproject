adapter driver remote_bitbang
remote_bitbang host 192.168.0.192
remote_bitbang port 5555
transport select swd
adapter speed 1000
source [find target/stm32f1x.cfg]
reset_config none
cortex_m reset_config sysresetreq
init
mdw 0x08000000 32
mdw 0x08000800 32
mdw 0x08001000 32
mdw 0x08001800 32
mdw 0x08002000 32
mdw 0x08003000 32
mdw 0x08004000 32
mdw 0x08008000 32
mdw 0x0800C000 32
mdw 0x08010000 8
shutdown
